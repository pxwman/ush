<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink – URL Shortener</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>QuickLink</h1>
        <p>Shorten your long URLs instantly.</p>

        <form id="shorten-form">
            <input type="url" id="url-input" placeholder="https://example.com/very/long/link" required>
            <button type="submit">Shorten</button>
        </form>

        <div id="result" class="result hidden">
            <p>Your short URL:</p>
            <a id="short-url" href="#" target="_blank"></a>
            <button id="copy-btn">Copy</button>
        </div>

        <div class="stats">
            <h2>Check Stats</h2>
            <input type="text" id="stats-code" placeholder="Enter short code (e.g., abc1234)">
            <button id="stats-btn">Get Stats</button>
            <div id="stats-result"></div>
        </div>
    </div>
    <script src="/script.js"></script>
</body>
</html>
